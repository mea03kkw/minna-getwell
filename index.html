<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Minna～快啲好返呀 🌸</title>

  <style>
    body{
      margin:0;
      background:#fffaf0;
      font-family:
        "PingFang HK",
        "Heiti TC",
        "Noto Sans TC",
        system-ui, -apple-system;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
    }

    .card{
      background:white;
      border-radius:26px;
      padding:32px 28px 34px;
      width:min(620px,100%);
      box-shadow:0 12px 28px rgba(0,0,0,.12);
      position:relative;
    }

    .emoji{
      position:absolute;
      top:-20px;
      right:24px;
      font-size:42px;
      transform:rotate(8deg);
    }

    h1{
      margin:0;
      text-align:center;
      font-size:clamp(24px,4vw,32px);
    }

    .text{
      margin-top:22px;
      font-size:18px;
      line-height:1.8;
    }

    .text p{
      margin:0 0 14px;
    }

    .footer{
      margin-top:26px;
      text-align:right;
      font-size:16px;
    }

    .note{
      margin-top:22px;
      text-align:center;
      font-size:13px;
      color:#999;
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="emoji">🩹🌷</div>

    <h1>Minna～要乖乖休息呀 💛</h1>

    <div class="text">
      <p>
        知道你整親隻腳，  
        希望你可以慢慢休息，  
        一日一日咁好返。
      </p>

      <p>
        乜都唔使急，  
        最重要係身體同心情都舒服。
      </p>

      <p>
        祝你早日康復 🌈
      </p>
    </div>

    <div class="footer">
      — Kaye
    </div>

    <div class="note">
      （純關心・非官方小卡 🧸）
    </div>
  </div>
</body>
</html>
